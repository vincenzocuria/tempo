name: Android verification and APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-previous-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p baseline-evidence
            adb install Tempo.apk
            adb logcat -c
            adb shell am start -W -n com.tempo.app.tempo/.MainActivity
            sleep 20
            adb logcat -d > baseline-evidence/logcat.txt
            adb shell dumpsys activity activities > baseline-evidence/activity.txt
            adb exec-out screencap -p > baseline-evidence/screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-startup-evidence
          path: baseline-evidence/
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-v1.0.24-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release APK startup and upgrade on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh
      - name: Release APK startup and upgrade on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-evidence
          path: smoke-evidence/